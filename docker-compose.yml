services:
  db:
    image: postgres:16-alpine
    container_name: career-profile-db
    environment:
      POSTGRES_USER: profile_app
      POSTGRES_PASSWORD: profile_app
      POSTGRES_DB: career_profile
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U profile_app -d career_profile"]
      interval: 2s
      timeout: 2s
      retries: 30
